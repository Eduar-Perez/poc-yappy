spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

yappy.merchant-id=${MERCHANT_ID}
yappy.secret-key=${SECRET_KEY}

yappy.base-url=${BASE_URL}
yappy.endpoint-token=${ENDPOINT_TOKEN}
yappy.endpoint-order=${ENDPOINT_ORDER}

yappy.webhook-url=${WEBHOOK_URL}
yappy.ipn_url=${IPN_URL}
yappy.domain=${DOMAIN}